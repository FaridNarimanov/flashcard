<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1220">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="pdf.min.js"></script>
<style>
  :root {
    --bg: #0f1220;
    --card-bg: #1b1f36;
    --accent: #6c8cff;
    --green: #3ddc97;
    --red: #ff5c6c;
    --text: #eef0fb;
    --muted: #9aa1c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #0f1220, #171b30);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 24px; text-align: center; }
  .panel {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    margin-bottom: 20px;
  }
  .upload-box {
    border: 2px dashed #3a4066;
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
    display: block;
  }
  .upload-box:hover { border-color: var(--accent); background: rgba(108,140,255,.06); }
  .upload-box input { display: none; }
  .upload-box .icon { font-size: 2rem; margin-bottom: 8px; }
  .status { margin-top: 14px; font-size: .85rem; color: var(--muted); text-align: center; min-height: 18px; white-space: pre-line; }
  .progress-bar {
    width: 100%; height: 6px; background: #2a2f52; border-radius: 3px; overflow: hidden; margin-top: 10px; display: none;
  }
  .progress-bar > div { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
  textarea.raw-preview {
    width: 100%; height: 160px; margin-top: 14px; background: #12152a; color: var(--muted);
    border: 1px solid #2a2f52; border-radius: 8px; padding: 10px; font-size: .78rem; resize: vertical; display: none;
    font-family: monospace;
    line-height: 1.5;
  }
  .btn {
    display: inline-block; padding: 10px 20px; border-radius: 10px; border: none;
    font-size: .95rem; font-weight: 600; cursor: pointer; transition: .15s;
  }
  .btn-primary { background: var(--accent); color: #0f1220; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid #3a4066; color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }

  .hidden { display: none !important; }

  .card-area { width: 100%; max-width: 480px; text-align: center; }
  .progress-info { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }

  .flip-wrap {
    perspective: 1200px;
    cursor: pointer;
    user-select: none;
  }
  .flashcard {
    position: relative;
    min-height: 160px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    transition: transform .4s;
    transform-style: preserve-3d;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    font-size: 1.5rem;
    font-weight: 600;
    word-break: break-word;
  }
  .face-front { background: var(--card-bg); }
  .face-back {
    background: #262c4d;
    transform: rotateY(180deg);
    font-size: 1.15rem;
    font-weight: 500;
    color: #d8dcf7;
  }
  .word-num { font-size: .75rem; color: var(--muted); font-weight: 400; position: absolute; top: 14px; left: 18px; }

  .answer-buttons { display: flex; gap: 14px; margin-top: 24px; justify-content: center; }
  .answer-buttons button {
    flex: 1; max-width: 180px; padding: 16px 10px; border-radius: 14px; border: none;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: .15s;
  }
  .know-btn { background: var(--green); color: #06251a; }
  .know-btn:hover { filter: brightness(1.08); }
  .dontknow-btn { background: var(--red); color: #2a0509; }
  .dontknow-btn:hover { filter: brightness(1.08); }

  .summary { text-align: center; }
  .summary h2 { margin-bottom: 6px; }
  .summary p { color: var(--muted); margin-top: 0; }
  .word-list {
    text-align: left; background: var(--card-bg); border-radius: 14px; padding: 16px 20px;
    margin-top: 16px; max-height: 320px; overflow-y: auto;
  }
  .word-list div { padding: 8px 0; border-bottom: 1px solid #2a2f52; font-size: 1rem; }
  .word-list div:last-child { border-bottom: none; }
  .empty-note { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<h1>🗂️ Flashcard Tətbiqi</h1>
<div class="subtitle">PDF, MD, TXT və ya şəkil yüklə, sözləri avtomatik ayır, öyrən</div>

<!-- UPLOAD PANEL -->
<div class="panel" id="uploadPanel">
  <label class="upload-box" id="uploadBox">
    <div class="icon">📄</div>
    <div><strong>PDF, MD və ya şəkil seç</strong></div>
    <div style="color:var(--muted); font-size:.8rem; margin-top:4px;">PDF, MD, TXT, JPG və ya PNG faylı</div>
    <input type="file" id="fileInput" accept="image/*,.pdf,.md,.markdown,.txt,text/markdown,text/plain">
  </label>
  <div class="progress-bar" id="progressBar"><div id="progressFill"></div></div>
  <div class="status" id="statusText"></div>
  <textarea class="raw-preview" id="rawPreview" placeholder="Tanınan sətirlər burada görünəcək — hər sətir 'söz - məna1 - rusca' formatında olmalıdır. İstəsən düzəliş et."></textarea>
  <div class="row">
    <button class="btn btn-primary" id="parseBtn" disabled>Sözləri ayır və başla</button>
  </div>
</div>

<!-- CARD AREA -->
<div class="card-area hidden" id="cardArea">
  <div class="progress-info" id="progressInfo"></div>
  <div class="flip-wrap" id="flipWrap">
    <div class="flashcard" id="flashcard">
      <div class="face face-front">
        <div class="word-num" id="wordNum"></div>
        <div id="wordTextEn"></div>
      </div>
      <div class="face face-back">
        <div id="wordTextMeaning"></div>
      </div>
    </div>
  </div>
  <div class="answer-buttons">
    <button class="dontknow-btn" id="dontKnowBtn">❌ Bilmirəm</button>
    <button class="know-btn" id="knowBtn">✅ Bilirəm</button>
  </div>
  <div class="row">
    <button class="btn btn-outline" id="restartBtn">Yeni fayl yüklə</button>
  </div>
</div>

<!-- SUMMARY -->
<div class="panel summary hidden" id="summaryArea">
  <h2 id="summaryTitle"></h2>
  <p id="summarySubtitle"></p>
  <div class="word-list" id="wordList"></div>
  <div class="row">
    <button class="btn btn-primary hidden" id="retryUnknownBtn">Bilmədiklərimi yenidən öyrən</button>
    <button class="btn btn-outline" id="restartAllBtn">Bütün sözləri yenidən başla</button>
    <button class="btn btn-outline" id="resetAllBtn">Yeni fayl yüklə</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

const fileInput = document.getElementById('fileInput');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const statusText = document.getElementById('statusText');
const rawPreview = document.getElementById('rawPreview');
const parseBtn = document.getElementById('parseBtn');

const uploadPanel = document.getElementById('uploadPanel');
const cardArea = document.getElementById('cardArea');
const summaryArea = document.getElementById('summaryArea');

let words = []; // current round {num, term, meaning}
let allWords = []; // full parsed list (kept so we can restart without the PDF)
let phase = 'upload'; // upload | cards | summary
const STORE_KEY = 'flashcards_state_v1';
let currentIndex = 0;
let unknownWords = [];
let isRetryRound = false;
let isFlipped = false;
let sourceKind = 'pdf'; // pdf | text (md/txt) | image — decides how strict the parser is

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  statusText.textContent = 'Fayl oxunur...';
  progressBar.style.display = 'block';
  progressFill.style.width = '5%';
  parseBtn.disabled = true;
  rawPreview.style.display = 'none';

  try {
    let fullText = '';
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const isText = !isPdf && (/\.(md|markdown|txt)$/i.test(file.name) || (file.type || '').startsWith('text/'));
    sourceKind = isPdf ? 'pdf' : (isText ? 'text' : 'image');
    if (isPdf) {
      fullText = await extractFromPDF(file);
    } else if (isText) {
      fullText = normalizeMarkdown(await file.text());
    } else {
      fullText = await extractFromImage(file);
    }
    rawPreview.value = fullText.trim();
    rawPreview.style.display = 'block';
    statusText.textContent = 'Mətn çıxarıldı. İstəsən düzəliş et, sonra "Sözləri ayır" düyməsinə bas.';
    progressFill.style.width = '100%';
    parseBtn.disabled = false;
  } catch (err) {
    console.error(err);
    statusText.textContent = 'Xəta baş verdi: ' + err.message;
  }
});

async function extractFromImage(file) {
  return new Promise((resolve, reject) => {
    Tesseract.recognize(file, 'eng+rus+aze', {
      logger: (m) => {
        if (m.status === 'recognizing text') {
          progressFill.style.width = (m.progress * 100).toFixed(0) + '%';
          statusText.textContent = 'Tanınır: ' + (m.progress * 100).toFixed(0) + '%';
        } else {
          statusText.textContent = m.status;
        }
      }
    }).then(({ data: { text } }) => resolve(text)).catch(reject);
  });
}

// --- PDF extraction using PDF.js text layer (NOT OCR) ---
// Each page's text items carry x/y coordinates. For a two-column layout (common in
// vocabulary PDFs) we split items into left/right columns by the page midpoint,
// then sort each column top-to-bottom, then join left column followed by right column.
// Lines that wrap (no leading number) are merged into the previous numbered entry.
async function extractFromPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let allLines = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    statusText.textContent = `Səhifə ${p}/${pdf.numPages} oxunur...`;
    progressFill.style.width = ((p - 1) / pdf.numPages * 100).toFixed(0) + '%';

    const page = await pdf.getPage(p);
    const viewport = page.getViewport({ scale: 1 });
    const content = await page.getTextContent();
    const pageWidth = viewport.width;
    const midX = pageWidth / 2;

    // Group text items into lines by y-coordinate (rounded), per column
    const leftItems = [];
    const rightItems = [];

    for (const item of content.items) {
      if (!item.str) continue; // keep whitespace-only items: they are the real spaces
      const x = item.transform[4];
      const y = item.transform[5];
      const width = item.width || 0;
      const entry = { str: item.str, x, y, width, height: item.height || 0 };
      if (x < midX) leftItems.push(entry);
      else rightItems.push(entry);
    }

    function groupIntoLines(items) {
      // sort by y descending (PDF y-axis goes up), then x ascending
      items.sort((a, b) => (b.y - a.y) || (a.x - b.x));
      const lines = [];
      let currentLine = [];
      let lastY = null;
      const Y_TOLERANCE = 3;
      for (const it of items) {
        if (lastY === null || Math.abs(it.y - lastY) <= Y_TOLERANCE) {
          currentLine.push(it);
        } else {
          if (currentLine.length) lines.push(currentLine);
          currentLine = [it];
        }
        lastY = it.y;
      }
      if (currentLine.length) lines.push(currentLine);
      return lines.map(line => {
        line.sort((a, b) => a.x - b.x);

        // Join items exactly as the PDF gives them. PDF.js emits real spaces as
        // separate " " items, and letters like "ə" as separate items with ZERO gap
        // to their neighbours — so we must NOT add spaces between items blindly.
        // Only as a fallback (PDFs that omit space items) we add a space when the
        // horizontal gap between two items is clearly a word gap.
        let text = '';
        let prevEnd = null;
        for (const it of line) {
          const str = it.str;
          if (prevEnd !== null && !/\s$/.test(text) && !/^\s/.test(str) && it.height > 0) {
            const gap = it.x - prevEnd;
            if (gap > it.height * 0.2) text += ' ';
          }
          text += str;
          prevEnd = it.x + (it.width || 0);
        }
        return text.replace(/\s+/g, ' ').trim();
      }).filter(l => l.length > 0);
    }

    const leftLines = groupIntoLines(leftItems);
    const rightLines = groupIntoLines(rightItems);

    allLines.push(...leftLines, ...rightLines);
  }

  // Merge wrapped lines: a line that does NOT start with "<number>." is a continuation
  // of the previous entry (the PDF wraps long translations onto the next visual line).
  const merged = [];
  const numberStart = /^\d+[\.\)]\s*/;
  for (const line of allLines) {
    if (numberStart.test(line) || merged.length === 0) {
      merged.push(line);
    } else {
      merged[merged.length - 1] += ' ' + line;
    }
  }

  progressFill.style.width = '100%';
  return merged.join('\n');
}

// --- MARKDOWN / TXT SUPPORT ---
// Turns common markdown into plain "N. word - meaning - russian" lines so the same
// parser handles it: strips headings, quotes, bullet markers, bold/strike/code marks,
// and converts table rows ("| 1 | word | meaning |") into dash-separated lines.
function normalizeMarkdown(text) {
  const rawLines = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n').map(l => l.trim());
  const isSeparator = (l) => /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(l) && l.includes('-');
  const out = [];

  for (let i = 0; i < rawLines.length; i++) {
    let l = rawLines[i];
    if (!l) continue;
    if (isSeparator(l)) continue;                                   // | --- | --- |
    // a table header row is followed by a separator row: skip it ("| Word | Meaning |")
    if (l.includes('|') && i + 1 < rawLines.length && isSeparator(rawLines[i + 1])) continue;

    l = l.replace(/^#{1,6}\s+/, '');                                // # headings
    l = l.replace(/^>\s?/, '');                                     // > quotes
    l = l.replace(/^[-*+]\s+/, '');                                 // - bullet / * bullet
    l = l.replace(/(\*\*|__|~~|`)/g, '');                           // bold, strike, code

    if (l.includes('|')) {                                          // table row -> "a - b - c"
      const cells = l.split('|').map(c => c.trim()).filter(Boolean);
      if (cells.length >= 2) {
        l = /^\d+[.)]?$/.test(cells[0]) && cells.length >= 3
          ? cells[0].replace(/[.)]$/, '') + '. ' + cells.slice(1).join(' - ')
          : cells.join(' - ');
      }
    }
    out.push(l.trim());
  }
  return out.join('\n');
}

// --- PARSING LOGIC ---
// Split only on " - " (dash with a space on BOTH sides) so hyphenated words like
// "tez-tez" or "break-off" are never split.
// First segment (before 1st " - ") = the term (leading "211." number stripped).
// Second segment (between 1st and 2nd " - ") = the meaning to keep.
// Anything after the 2nd " - " (Russian translation) is discarded.
function splitOnSpacedDash(line) {
  // also accept spaced en/em dash (–, —): some PDF entries use them instead of "-"
  return line.split(/\s[-\u2013\u2014]\s/);
}

// requireNumber=true (PDF/image): only lines starting with "N." count, which filters out
// page numbers/headers. For md/txt files lines don't have to be numbered.
function parseText(text, requireNumber = true) {
  let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  // Cut off a "Synonyms" section if present — it uses a different format
  // (word / translation, no " - ") and is not part of the numbered word list.
  // The header sometimes gets glued onto the end of the last numbered line
  // (line-wrap merging), so search for the word anywhere, not just at line-start.
  const synonymsIdx = lines.findIndex(l => /\bsynonyms\b/i.test(l));
  if (synonymsIdx !== -1) {
    // keep everything before "Synonyms" on that line, drop the rest and all following lines
    const cut = lines[synonymsIdx].replace(/\bsynonyms\b.*$/i, '').trim();
    lines = lines.slice(0, synonymsIdx);
    if (cut) lines.push(cut);
  }

  const result = [];
  let autoNum = 1;
  const numberStart = /^\d+[\.\)]\s*/;

  for (const line of lines) {
    // Only treat lines that actually begin with a number as dictionary entries —
    // this avoids stray headers/footers (e.g. a lone page number) being parsed.
    if (requireNumber && !numberStart.test(line)) continue;

    const parts = splitOnSpacedDash(line);
    if (parts.length < 2) continue; // no valid " - " separator, skip

    let termPart = parts[0].trim();
    let meaningPart = parts[1].trim(); // only segment 1→2; ignore segment 2+ (Russian)

    // Strip leading number like "211." or "211)" from the term part
    termPart = termPart.replace(numberStart, '');

    // Strip a trailing page-number artifact that can get glued onto the last
    // entry of a page (e.g. "... получать, принять 253")
    if (requireNumber) meaningPart = meaningPart.replace(/\s+\d{1,4}$/, '').trim();

    if (!termPart || !meaningPart) continue;

    result.push({
      num: autoNum++,
      term: termPart,
      meaning: meaningPart
    });
  }
  return result;
}

document.getElementById('parseBtn').addEventListener('click', () => {
  const text = rawPreview.value;
  words = parseText(text, sourceKind !== 'text');
  if (words.length === 0) {
    statusText.textContent = 'Heç bir söz tapılmadı. Mətni yoxla (" - " formatına uyğun olmalıdır).';
    return;
  }
  statusText.textContent = `${words.length} söz tapıldı.`;
  startSession(words);
});

// ---- persistence (survives closing the app / browser cleanup) ----
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      allWords, words, currentIndex, unknownWords, isRetryRound, phase
    }));
  } catch (e) { /* storage full/blocked: app still works, just without saving */ }
}
function clearState() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const st = JSON.parse(raw);
    if (!st || !Array.isArray(st.allWords) || st.allWords.length === 0) return false;
    allWords = st.allWords;
    words = Array.isArray(st.words) && st.words.length ? st.words : allWords.slice();
    currentIndex = Number.isInteger(st.currentIndex) ? st.currentIndex : 0;
    unknownWords = Array.isArray(st.unknownWords) ? st.unknownWords : [];
    isRetryRound = !!st.isRetryRound;
    uploadPanel.classList.add('hidden');
    if (st.phase === 'summary' || currentIndex >= words.length) {
      finishSession();
    } else {
      phase = 'cards';
      cardArea.classList.remove('hidden');
      showCard();
    }
    return true;
  } catch (e) { return false; }
}

// Fisher-Yates shuffle (returns a new array, original untouched)
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSession(list) {
  allWords = list.slice();
  words = shuffle(list);
  phase = 'cards';
  currentIndex = 0;
  unknownWords = [];
  isRetryRound = false;
  uploadPanel.classList.add('hidden');
  summaryArea.classList.add('hidden');
  cardArea.classList.remove('hidden');
  showCard();
}

function showCard() {
  const w = words[currentIndex];
  const card = document.getElementById('flashcard');

  // Reset the card to the front side INSTANTLY (no flip animation) *before* the
  // text changes. Otherwise the card spins back for ~0.4s while the back face
  // already holds the next word's translation, which makes it flash on screen.
  card.style.transition = 'none';
  card.classList.remove('flipped');
  isFlipped = false;
  void card.offsetWidth; // force reflow so the un-flipped state is applied now

  document.getElementById('wordNum').textContent = `${currentIndex + 1} / ${words.length}`;
  document.getElementById('progressInfo').textContent = isRetryRound
    ? `Təkrar dövr — bilmədiklərin (${currentIndex + 1}/${words.length})`
    : `Söz ${currentIndex + 1} / ${words.length}`;
  document.getElementById('wordTextEn').textContent = w.term;
  document.getElementById('wordTextMeaning').textContent = w.meaning;

  saveState();

  // re-enable the flip animation for the user's next tap
  requestAnimationFrame(() => { card.style.transition = ''; });
}

document.getElementById('flipWrap').addEventListener('click', () => {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
});

document.getElementById('knowBtn').addEventListener('click', () => nextCard(false));
document.getElementById('dontKnowBtn').addEventListener('click', () => nextCard(true));

function nextCard(markUnknown) {
  if (markUnknown) unknownWords.push(words[currentIndex]);
  currentIndex++;
  if (currentIndex >= words.length) {
    finishSession();
  } else {
    showCard();
  }
}

function finishSession() {
  phase = 'summary';
  cardArea.classList.add('hidden');
  summaryArea.classList.remove('hidden');

  const title = document.getElementById('summaryTitle');
  const subtitle = document.getElementById('summarySubtitle');
  const listEl = document.getElementById('wordList');
  const retryBtn = document.getElementById('retryUnknownBtn');

  title.textContent = '🎉 Tamamlandı!';
  subtitle.textContent = `Bilmədiyin sözlərin sayı: ${unknownWords.length} / ${words.length}`;

  listEl.innerHTML = '';
  if (unknownWords.length === 0) {
    listEl.innerHTML = '<div class="empty-note">Bütün sözləri bilirsən! 🎉</div>';
    retryBtn.classList.add('hidden');
  } else {
    unknownWords.forEach(w => {
      const div = document.createElement('div');
      div.textContent = `${w.term} — ${w.meaning}`;
      listEl.appendChild(div);
    });
    retryBtn.classList.remove('hidden');
  }
  saveState();
}

document.getElementById('retryUnknownBtn').addEventListener('click', () => {
  words = shuffle(unknownWords);
  phase = 'cards';
  currentIndex = 0;
  unknownWords = [];
  isRetryRound = true;
  summaryArea.classList.add('hidden');
  cardArea.classList.remove('hidden');
  showCard();
});

document.getElementById('restartAllBtn').addEventListener('click', () => {
  summaryArea.classList.add('hidden');
  cardArea.classList.remove('hidden');
  startSession(allWords);
});

document.getElementById('restartBtn').addEventListener('click', () => {
  if (confirm('Yeni fayl yükləmək istəyirsən? Saxlanmış sözlər və irəliləyiş silinəcək.')) {
    resetToUpload();
  }
});

document.getElementById('resetAllBtn').addEventListener('click', () => {
  if (confirm('Yeni fayl yükləmək istəyirsən? Saxlanmış sözlər silinəcək.')) resetToUpload();
});

function resetToUpload() {
  clearState();
  phase = 'upload';
  allWords = [];
  words = [];
  unknownWords = [];
  currentIndex = 0;
  isRetryRound = false;
  fileInput.value = '';
  rawPreview.value = '';
  rawPreview.style.display = 'none';
  statusText.textContent = '';
  progressBar.style.display = 'none';
  progressFill.style.width = '0%';
  parseBtn.disabled = true;
  cardArea.classList.add('hidden');
  summaryArea.classList.add('hidden');
  uploadPanel.classList.remove('hidden');
}

// ---- boot ----
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
loadState();
</script>
</body>
</html>
